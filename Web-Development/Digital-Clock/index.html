<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Digital Bomb Clock</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="clock-body">
      <div class="clock-screen">
        <div class="time">
          <span id="hh">00</span>
          <span class="colon">:</span>
          <span id="mm">00</span>
          <span class="colon">:</span>
          <span id="ss">00</span>
        </div>

        <div id="ampm">AM</div>

        <div id="date"></div>
      </div>

      <div class="buttons">
        <button id="formatBtn">12H / 24H</button>
        <button id="themeBtn">☀ Light</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
